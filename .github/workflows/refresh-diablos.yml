name: Refresh Diablos Rojos fixtures

# Pulls latest schedule from diablos.com.mx weekly and commits if changed.
# Triggers a Vercel auto-deploy via push.
#
# Pre-reqs: this file lives in .github/workflows/ once you authorize it.
# Move with:
#   git mv scripts/_pending_manual/refresh-diablos.yml .github/workflows/
# Requires PAT with `workflow` scope (default repo PAT works if it has it).
# No external API key needed — scrapes the public website.

on:
  schedule:
    # Mondays at 15:00 UTC = 09:00 CDMX (UTC-6).
    # Weekly is enough; the LMB publishes calendar updates rarely.
    - cron: '0 15 * * 1'
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Sep 2 2026 -- techo de tiempo. Descarga el calendario de partidos y lo guarda. Peor corrida medida:
    # 0.4 min sobre 15 corridas. La llamada de red del script de Python ya
    # trae su propio limite (timeout=15); 5 minutos es la red de arriba.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate fixtures.json + ICS feeds
        run: python3 scripts/build_diablos_fixtures.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/diablos-fixtures.json public/calendar/diablos-rojos-2026*.ics; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat -- data/diablos-fixtures.json public/calendar/diablos-rojos-2026*.ics
          fi

      - name: Commit + push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diablos-fixtures.json public/calendar/diablos-rojos-2026*.ics
          git commit -m "chore(diablos): refresh fixtures from diablos.com.mx [skip ci]" \
            -m "X-Actor: sistema:refresh-diablos"
          git push
