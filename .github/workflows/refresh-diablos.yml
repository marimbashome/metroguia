name: Refresh Diablos Rojos fixtures

# Pulls latest schedule from diablos.com.mx weekly and, if changed, opens or
# updates a PR against main (main is protected: no direct pushes). The PR merge
# triggers a Vercel auto-deploy. We never force-push or approve the PR itself.
#
# No external API key needed — scrapes the public website.

on:
  schedule:
    # Mondays at 15:00 UTC = 09:00 CDMX (UTC-6).
    # Weekly is enough; the LMB publishes calendar updates rarely.
    - cron: '0 15 * * 1'
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Sep 2 2026 -- techo de tiempo. Descarga el calendario de partidos y lo guarda. Peor corrida medida:
    # 0.4 min sobre 15 corridas. La llamada de red del script de Python ya
    # trae su propio limite (timeout=15); 5 minutos es la red de arriba.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate fixtures.json + ICS feeds
        run: python3 scripts/build_diablos_fixtures.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/diablos-fixtures.json public/calendar/diablos-rojos-2026*.ics; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat -- data/diablos-fixtures.json public/calendar/diablos-rojos-2026*.ics
          fi

      - name: Commit + open/update PR if changed
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: auto/refresh-diablos-fixtures
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diablos-fixtures.json public/calendar/diablos-rojos-2026*.ics
          git commit -m "chore(diablos): refresh fixtures from diablos.com.mx [skip ci]" \
            -m "X-Actor: sistema:refresh-diablos"
          # Rama dedicada, nunca push a main (protegida).
          git push origin "HEAD:refs/heads/$BRANCH"
          # Crea el PR si no existe; si ya existe, el push de arriba lo actualiza.
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(diablos): refresh fixtures from diablos.com.mx" \
              --body "Actualización automática del feed de Diablos Rojos (fixtures.json + ICS) desde diablos.com.mx. Generado por el workflow *Refresh Diablos Rojos fixtures*." \
              --no-merge
          else
            echo "PR existente para $BRANCH; quedó actualizado con el nuevo push."
          fi
